# Render-Blueprint: ein kostenloser Web-Service, der Spiel + Multiplayer-Server ausliefert.
services:
  - type: web
    name: astro-atzen
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      # Postgres-Adresse für Konten + Rangliste (z.B. von neon.com). Im Render-Dashboard eintragen.
      - key: DATABASE_URL
        sync: false
